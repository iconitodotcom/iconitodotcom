[tool.poetry]
name = "iconitodotcom"
version = "0.1.0"
description = "This is a webproject for iconitodocom"
authors = ["Julio Conchas <conchasjimenez@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
flask = "^3.1.0"
waitress = "^3.0.2"
flask-wtf = "^1.2.2"
supabase = "^2.27.2"
python-dotenv = "^1.2.1"
gotrue = "^2.12.4"
werkzeug = "^3.1.6"
flask-sqlalchemy = "^3.1.1"
flask-migrate = "^4.1.0"
flask-login = "^0.6.3"
psycopg2 = "^2.9.11"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
